<title>Might CRM</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#EEF1F6;--card:#FFFFFF;--ink:#0D1D34;--muted:#5A6A82;--line:#DCE2EC;--brand:#1F6FE5;--brand-soft:#E3EEFD;--nav:#07111F;--nav-ink:#DCE6F5;--amber:#FFB020;--amber-ink:#4A2F00;--hover:#F4F7FB;--ok:#0E7A55;--ok-soft:#DDF3EA;--warn:#8A5A00;--warn-soft:#FFF1D0;--bad:#B3261E;--bad-soft:#FDE4E2;--d-disp:#0E7A55;--d-disp-soft:#DDF3EA;--d-brk:#1F5FC4;--d-brk-soft:#E3EEFD;--d-sal:#8A5A00;--d-sal-soft:#FFF1D0;--shadow:0 1px 2px rgba(7,17,31,.06),0 4px 14px rgba(7,17,31,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--card:#0F1E36;--ink:#E8EEF8;--muted:#93A3BC;--line:#203455;--brand:#3B8CFF;--brand-soft:#16315C;--nav:#050C18;--nav-ink:#DCE6F5;--hover:#142845;--ok:#4FD1A1;--ok-soft:#10382E;--warn:#FFC85C;--warn-soft:#3A2D0E;--bad:#FF8A80;--bad-soft:#40201F;--d-disp:#4FD1A1;--d-disp-soft:#10382E;--d-brk:#7AB2FF;--d-brk-soft:#16315C;--d-sal:#FFC85C;--d-sal-soft:#3A2D0E;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1424;--card:#0F1E36;--ink:#E8EEF8;--muted:#93A3BC;--line:#203455;--brand:#3B8CFF;--brand-soft:#16315C;--nav:#050C18;--nav-ink:#DCE6F5;--hover:#142845;--ok:#4FD1A1;--ok-soft:#10382E;--warn:#FFC85C;--warn-soft:#3A2D0E;--bad:#FF8A80;--bad-soft:#40201F;--d-disp:#4FD1A1;--d-disp-soft:#10382E;--d-brk:#7AB2FF;--d-brk-soft:#16315C;--d-sal:#FFC85C;--d-sal-soft:#3A2D0E;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.85em}
.sub{color:var(--muted)}
#top{background:var(--nav);color:var(--nav-ink);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.logo svg{width:28px;height:28px}
.logo small{display:block;font-weight:500;letter-spacing:.2em;font-size:9px;color:#6FA8FF}
#sw{position:relative;flex:1 1 280px;max-width:520px;min-width:0}
#sq{width:100%;background:#12233D;border:1px solid #223A5E;border-radius:8px;padding:8px 12px;color:#fff}
#sq::placeholder{color:#8FA3C2}
#sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;z-index:50}
#sres button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:9px 12px}
#sres button:hover{background:var(--hover)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}
.who select{background:#12233D;border:1px solid #223A5E;color:#fff;border-radius:8px;padding:7px 9px;max-width:230px}
#tabs{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
#tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--amber)}
main{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
h1{font-size:1.45rem;margin:0 0 4px;text-wrap:balance}
h2{font-size:1rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.pad{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (max-width:900px){.g2{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-disp{background:var(--d-disp-soft);color:var(--d-disp)}.p-brk{background:var(--d-brk-soft);color:var(--d-brk)}.p-sal{background:var(--d-sal-soft);color:var(--d-sal)}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-idle{background:var(--hover);color:var(--muted);border:1px solid var(--line)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.blue{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}tr.row:hover td{background:var(--hover)}
tr.lock td{color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--hover) 8px 16px)}
.num{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600;font-size:12.5px}
.chip[aria-pressed=true]{background:var(--nav);border-color:var(--nav);color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.av{width:44px;height:44px;border-radius:10px;background:var(--nav);color:var(--amber);display:grid;place-items:center;font-weight:700;flex:none}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.hl span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hl b{font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:11px 14px;margin-bottom:16px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.banner.info{background:var(--brand-soft)}
.path{display:flex;gap:0;overflow-x:auto;margin:0 0 16px}
.path button{flex:1 1 0;min-width:110px;border:0;background:var(--hover);color:var(--muted);padding:11px 16px 11px 26px;font-weight:600;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-right:-6px}
.path button:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:16px;border-radius:8px 0 0 8px}
.path button.done{background:var(--ok-soft);color:var(--ok)}
.path button.cur{background:var(--brand);color:#fff}
.path button:disabled{cursor:default}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;background:var(--hover);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;padding:14px 16px}
.kv span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--hover);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between}
.oc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.oc:hover{border-color:var(--brand)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--brand)}
.bar span{width:96px;font-size:12.5px;color:var(--muted)}
.dep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.dep.off{border-style:dashed;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(5,12,24,.55);display:grid;place-items:center;padding:16px;z-index:100}
#modal[hidden]{display:none}
.mb{background:var(--card);border-radius:14px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:18px;border:1px solid var(--line)}
.form label{display:block;margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:600}
.form input,.form select,.form textarea{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
#toast[hidden]{display:none}
.story{border:1px solid var(--amber);background:var(--warn-soft)}
.step{display:flex;gap:10px;margin:8px 0}
.step b.n{width:22px;height:22px;border-radius:50%;background:var(--nav);color:var(--amber);display:grid;place-items:center;font-size:12px;flex:none}
.empty{padding:22px 16px;color:var(--muted)}
.rl{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.rl{grid-template-columns:minmax(0,1fr)}}
.rp-sec{border-bottom:1px solid var(--line);padding:12px 14px}
.rp-sec:last-child{border-bottom:0}
.rp-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.rp-sec select,.rp-sec input[type=text],.rp-sec input[type=date],.rp-sec input[type=number],.rp-sec input:not([type]){width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);min-width:0}
.rp-row{display:grid;gap:6px;margin-bottom:8px;grid-template-columns:minmax(0,1fr)}
.rp-row.f3{grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1fr) auto}
.rp-row.m2{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.lnk{border:0;background:none;color:var(--brand);font-weight:600;padding:0}
.tile{padding:14px 16px}
.tile>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile b{display:block;font-size:1.6rem;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.dl{font-size:12px;font-weight:600}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}.dl.fl{color:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.hb i{display:block;height:12px;border-radius:6px;background:var(--brand);min-width:2px}
.hb i.b2{background:var(--amber)}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{display:flex;align-items:flex-end;gap:6px;height:170px;padding:8px 4px 0;overflow-x:auto}
.vb div{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);text-align:center}
.vb i{display:block;width:100%;max-width:46px;background:var(--brand);border-radius:5px 5px 0 0;min-height:2px}
tr.g1 td{font-weight:700;background:var(--hover)}
tr.g2 td:first-child{padding-left:30px}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.lib h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.rc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rc:hover{border-color:var(--brand)}
.rp-row.f3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.rp-row.f3 input{grid-column:1/3;order:5}
.card>header h2{white-space:nowrap}.card>header{flex-wrap:wrap}

/* ===== themes ===== */
.who{gap:10px}.who .th{display:flex;align-items:center;gap:6px}
html:root[data-ui="side"]{--ok:#0E7A55;--ok-soft:#DDF3EA;--warn:#8A5A00;--warn-soft:#FFF1D0;--bad:#B3261E;--bad-soft:#FDE4E2;--d-disp:#0E7A55;--d-disp-soft:#DDF3EA;--d-brk:#1F5FC4;--d-brk-soft:#E3EEFD;--d-sal:#8A5A00;--d-sal-soft:#FFF1D0;--bg:#F3F5F9;--card:#FFFFFF;--ink:#0F1A2E;--muted:#64748B;--line:#E2E8F0;--brand:#2563EB;--brand-soft:#E6EEFE;--nav:#0B1426;--hover:#F1F5FA;--shadow:0 1px 2px rgba(15,26,46,.05); color-scheme:light}
/* Slate Sidebar */
html[data-ui=side] body{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh;align-content:start}
html[data-ui=side] #top{grid-column:1/3;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
html[data-ui=side] #sq{background:var(--bg);border-color:var(--line);color:var(--ink)}
html[data-ui=side] #sq::placeholder{color:var(--muted)}
html[data-ui=side] .who select{background:var(--bg);border-color:var(--line);color:var(--ink)}
html[data-ui=side] .who label{color:var(--muted)!important}
html[data-ui=side] .logo{color:var(--ink)}html[data-ui=side] .logo small{color:var(--brand)}
html[data-ui=side] #tabs{grid-column:1;grid-row:2;flex-direction:column;background:var(--nav);border:0;padding:16px 10px;gap:3px;overflow:visible;align-content:start}
html[data-ui=side] #tabs button{text-align:left;color:#A9B8D0;border:0;border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:center}
html[data-ui=side] #tabs button::before{content:"";width:16px;text-align:center;opacity:.85}
html[data-ui=side] #tabs button[data-v=home]::before{content:"\2302"}html[data-ui=side] #tabs button[data-v=accts]::before{content:"\25A4"}html[data-ui=side] #tabs button[data-v=opps]::before{content:"\25C8"}html[data-ui=side] #tabs button[data-v=loads]::before{content:"\2708"}html[data-ui=side] #tabs button[data-v=leads]::before{content:"\260E"}html[data-ui=side] #tabs button[data-v=reports]::before{content:"\25A6"}
html[data-ui=side] #tabs button:hover{background:rgba(255,255,255,.06);color:#fff}
html[data-ui=side] #tabs button[aria-current=page]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
html[data-ui=side] main{grid-column:2;grid-row:2;margin:0;max-width:none;width:100%}
html[data-ui=side] .card{border-radius:14px}
html[data-ui=side] .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-ui=side] .chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand)}
@media (max-width:860px){html[data-ui=side] body{display:block}html[data-ui=side] #tabs{flex-direction:row;overflow-x:auto;padding:0 12px;border-bottom:1px solid #1d2a44}html[data-ui=side] #tabs button{white-space:nowrap}html[data-ui=side] #tabs button::before{display:none}html[data-ui=side] main{margin:0 auto}}
.who{flex-wrap:wrap}.who .th{min-width:0;flex:1 1 auto}.who select{min-width:0;max-width:100%}
@media (max-width:700px){.who{margin-left:0;width:100%}.who .th{flex:1 1 100%}.who select{flex:1}}
#bell{position:relative;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:15px;line-height:1}
#bell b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#np{position:fixed;top:56px;right:max(12px,env(safe-area-inset-right,0px));width:min(400px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:6px}
#np[hidden]{display:none}
.nh{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 6px}
.nf{padding:8px;font-size:12px;color:var(--muted)}
.nt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:none;border:0;border-radius:8px;padding:9px 8px;color:var(--ink)}
.nt:hover{background:var(--hover)}.nt.un span{font-weight:600}.nt:not(.un){opacity:.7}
.dt{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--brand)}.dt.w{background:var(--amber)}.dt.f{background:var(--bad)}
.why{margin:0 0 6px;padding:0;list-style:none}.why li,.why-i{padding-left:16px;position:relative;margin:3px 0}
.why li:before,.why-i:before{content:"";position:absolute;left:2px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.why li.f:before,.why-i.f:before{background:var(--bad)}
.vb{border-radius:10px;padding:10px 12px;margin-top:12px;border:1px solid var(--line);background:var(--warn-soft)}
.vb.ok{background:var(--ok-soft)}.vb.bad{background:var(--bad-soft)}.vb.info{background:var(--brand-soft)}
.vb label.ck{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink)}.vb label.ck input{width:auto;margin:0}
.dr{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}.dr:last-child{border-bottom:0}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tools select,.tools input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink)}
td.mono{white-space:nowrap}
#bell b[hidden]{display:none}
.who .th[hidden]{display:none}

#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
.lgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.lgbox h1{margin:0;font-size:1.4rem}.lgbox label{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.lgbox input{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink)}
.lglogo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em}
#lgmsg{color:var(--bad);min-height:1.2em;font-size:13px}
.lgp{display:flex;flex-direction:column;gap:12px}.lgp[hidden]{display:none}.lnk{background:none;border:0;color:var(--brand,#3B8CFF);cursor:pointer;text-align:left;padding:0;font:inherit;font-size:13px}.lgbox input{box-sizing:border-box}
#whoami{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

 return run(async function(){
  var kind=x.kind,name=(f.company||f.name||'Website lead').trim(),isCar=kind!=='Quote Request';

  var note=kind==='Quote Request'?'Website quote request: '+[f.origin&&f.dest?f.origin+' to '+f.dest:'',f.equip,f.weight&&f.weight+' lbs',f.commodity,f.date&&'pickup '+f.date,f.notes].filter(Boolean).join(' · '):(kind+' received from the website. See the Inbox entry for documents.');
  await addAct(a.id,dept,'Note',note);
  must(await SB.from('intake_submissions').update({status:'Done',handled_by:ME_ID}).eq('id',id));window.__conv=a.id},'Created. The opportunity was assigned to '+'the teammate with the lightest load.',true).then(function(){if(window.__conv){var z=window.__conv;window.__conv=null;go('acct',z)}})}

window.teamV=function(){var rows=TEAM.map(function(u){return '<tr><td><b>'+esc(u.full_name||'')+'</b><div class="sub">'+esc(u.email||'')+(u.company?' · '+esc(u.company):'')+'</div></td><td><span class="pill p-idle">'+(RLABEL[u.role]||u.role)+'</span></td><td>'+(u.active?'<span class="pill p-ok">Active</span>':'<span class="pill p-bad">Off</span>')+'</td><td style="white-space:nowrap">'+(u.last_sign_in_at?fdt(lt(u.last_sign_in_at)):'Never')+'</td><td class="num"><button class="btn" type="button" data-a="tedit" data-v="'+u.id+'">Edit</button></td></tr>'}).join('');
 return '<h1>Team</h1><div class="sub">Everyone who can sign in. Roles decide what each person can see, and the database enforces it.</div><div class="tools"><button class="btn pri" type="button" data-a="tnew">Add a teammate</button></div>'+(TEAM.err?'<div class="banner"><div>'+esc(TEAM.err)+'</div></div>':'')+'<div class="card"><div class="tw"><table><thead><tr><th>Person</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="empty">No one yet.</td></tr>')+'</tbody></table></div></div><div class="sub" style="margin-top:10px;font-size:12px">Turning someone off blocks their sign-in immediately. Their past work and the change log stay.</div>'};

document.addEventListener('change',function(e){if(e.target&&e.target.id==='ur'){var w=$('#uacw');if(w)w.hidden=e.target.value!=='shipper'}});
function mNewUser(){return '<form class="form" id="fusr"><h2>Add a teammate</h2><div class="sub">They sign in with this email and password, then change it under Password.</div><label for="un">Full name<input id="un" required></label><label for="ue">Email<input id="ue" type="email" required></label><label for="ur">Role<select id="ur">'+roleOpts('broker',true)+'</select></label><label for="uac" id="uacw" hidden>Shipper company (their portal shows only this company\'s freight)<select id="uac">'+shipOpts()+'</select></label><label for="up">Temporary password (12+ characters)<input id="up" type="text" minlength="12" required autocomplete="off"></label><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" type="button" data-a="mclose">Cancel</button><button class="btn pri" type="submit">Add</button></div></form>'}

/* ---------- two-step sign-in (authenticator app) ---------- */
async function enrollInto(el,done){
 try{var fs=await SB.auth.mfa.listFactors();((fs.data&&fs.data.all)||[]).forEach(function(f){if(f.status!=='verified')SB.auth.mfa.unenroll({factorId:f.id})});
  var r=must(await SB.auth.mfa.enroll({factorType:'totp',friendlyName:'Authenticator app'})).data;
  el.innerHTML='<div class="sub">1. Open an authenticator app on your phone (Google Authenticator, Microsoft Authenticator, 1Password or Authy).<br>2. Add an account by scanning this code, or type the key.<br>3. Enter the 6-digit number the app shows.</div><div style="text-align:center;margin:10px 0"><img alt="Scan this code with your authenticator app" src="'+r.totp.qr_code+'" width="170" height="170" style="background:#fff;padding:6px;border-radius:8px;max-width:100%"></div><div class="sub" style="word-break:break-all">Key: <b>'+esc(r.totp.secret)+'</b></div><input id="ecode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="width:100%;margin-top:8px"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" type="button" id="ego">Turn on</button></div><div class="sub" id="emsg" style="color:var(--bad);min-height:1.2em"></div>';
  $('#ego').onclick=async function(){var m=$('#emsg');m.textContent='';try{var c=must(await SB.auth.mfa.challenge({factorId:r.id})).data;must(await SB.auth.mfa.verify({factorId:r.id,challengeId:c.id,code:$('#ecode').value.trim()}));await done()}catch(e){m.textContent='That code did not match. Wait for a fresh one and try again.'}}
 }catch(e){el.textContent=errMsg(e)}}
async function mfaModal(){var fs=await SB.auth.mfa.listFactors(),on=((fs.data&&fs.data.totp)||[])[0],adm0=me().r==='Admin';
 if(on){modal('<div class="form"><h2>Two-step sign-in</h2><div class="sub"><span class="pill p-ok">On</span> You enter a code from your authenticator app each time you sign in.'+(adm0?' It is required for admins.':'')+'</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'+(adm0?'':'<button class="btn" type="button" id="mfaoff">Turn off</button>')+'<button class="btn pri" type="button" data-a="mclose">Done</button></div></div>');
  var off=$('#mfaoff');if(off)off.onclick=async function(){try{must(await SB.auth.mfa.unenroll({factorId:on.id}));modal(null);toast('Two-step sign-in is off.')}catch(e){toast(errMsg(e))}};return}
 modal('<div class="form"><h2>Turn on two-step sign-in</h2><div id="mfab"></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" type="button" data-a="mclose">Cancel</button></div></div>');
 enrollInto($('#mfab'),async function(){modal(null);toast('Two-step sign-in is on.')})}

/* ---------- sign in ---------- */
async function boot(){var box=$('#login'),msg=$('#lgmsg'),recovering=/type=recovery/.test(location.hash);
 function show(t){msg.textContent=t||''}
 function pane(id){['lgf','lgm','lge','lgr'].forEach(function(k){var e=$('#'+k);if(e)e.hidden=(k!==id)});show('')}
 if(!SB){show('Could not load the sign-in service. Check your connection and refresh.');return}
 if(SB.auth.onAuthStateChange)SB.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){recovering=true;pane('lgr')}});
 async function enter(user){ME_ID=user.id;try{await hydrate();box.hidden=true;S.view='home';render()}catch(e){pane('lgf');show(errMsg(e));await SB.auth.signOut()}}
 async function needCode(user){pane('lgm');var fs=await SB.auth.mfa.listFactors(),f=((fs.data&&fs.data.totp)||[])[0];if(!f){show('Two-step sign-in is not set up for this login. Ask an admin.');return}
  $('#lgm').onsubmit=async function(ev){ev.preventDefault();show('');try{var c=must(await SB.auth.mfa.challenge({factorId:f.id})).data;must(await SB.auth.mfa.verify({factorId:f.id,challengeId:c.id,code:$('#lgc').value.trim()}));$('#lgc').value='';await enter(user)}catch(e){show('That code did not match. Wait for a fresh one and try again.')}}}
 async function gate(user){
  var a=(await SB.auth.mfa.getAuthenticatorAssuranceLevel()).data||{};
  if(a.nextLevel==='aal2'&&a.currentLevel!=='aal2')return needCode(user);
  var fs=await SB.auth.mfa.listFactors();
  if(!((fs.data&&fs.data.totp)||[]).length){var pr=await SB.from('profiles').select('role').eq('id',user.id),role=pr.data&&pr.data[0]&&pr.data[0].role;
   if(role==='admin'){pane('lge');enrollInto($('#lgeb'),async function(){await enter(user)});return}}
  return enter(user)}
 var s0=await SB.auth.getSession();if(s0.data&&s0.data.session&&!recovering){await gate(s0.data.session.user)}
 if(recovering)pane('lgr');
 $('#lgf').addEventListener('submit',async function(ev){ev.preventDefault();show('');var b=$('#lgb');b.disabled=true;b.textContent='Signing in...';
  var r=await SB.auth.signInWithPassword({email:$('#lge1').value.trim(),password:$('#lgp').value});b.disabled=false;b.textContent='Sign in';
  if(r.error){show('That email and password did not match.');return}await gate(r.data.user)});
 $('#lgfp').addEventListener('click',async function(){var em=$('#lge1').value.trim();if(!em){show('Type your email above first, then press Forgot password.');return}
  await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/crm'});show('If that email has a login, a reset link is on its way. Check your spam folder too.')});
 $('#lgr').addEventListener('submit',async function(ev){ev.preventDefault();var p=$('#lgn').value;if(p.length<12){show('Use at least 12 characters.');return}
  var r=await SB.auth.updateUser({password:p});if(r.error){show(errMsg(r.error));return}recovering=false;history.replaceState(null,'',location.pathname);var u=r.data.user;await gate(u)});
 $('#lgout').addEventListener('click',function(){SB.auth.signOut().then(function(){location.href=location.pathname})})}
boot();

render();
})();
</script>
